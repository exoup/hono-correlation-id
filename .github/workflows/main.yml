name: Publish hono-correlation-id to npm

# trigger when a release is created
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Clean install
        run: npm install
      - name: Run test
        run: npm run test
      - name: Build
        run: npm run build
      - uses: JS-DevTools/npm-publish@v4